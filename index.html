<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy. Supabase Auth and PostgREST are reached over
      https and wss, so `connect-src` must include the project domain; it is
      injected at build time by the `cspSupabaseOrigin` plugin in vite.config.ts
      so no host is hard-coded here. `style-src 'unsafe-inline'` is required by
      Tailwind's runtime style injection. `frame-ancestors` is ignored in a meta
      tag but kept for parity with a server-side header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' %VITE_CSP_SUPABASE_ORIGIN%; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Clean It CI - ERP Lavage Auto</title>
    <meta name="description" content="Plateforme ERP SaaS multitenant et vitrines commerciales de stations de lavage automobile en Côte d'Ivoire." />
    <meta property="og:title" content="Clean It CI - ERP Lavage Auto" />
    <meta property="og:description" content="Plateforme ERP SaaS multitenant et vitrines commerciales de stations de lavage automobile en Côte d'Ivoire." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
